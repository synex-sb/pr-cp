<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PR CP - Admin Panel</title>
    <link rel="stylesheet" href="admin.css">
</head>

<body>

<div id="loginPage" class="login-page">

    <div class="login-box">

        <div class="admin-logo">
            PR <span>CP</span>
        </div>

        <p class="admin-label">ADMIN PANEL</p>

        <h1>Welcome Back</h1>
        <p class="login-subtitle">Login to manage your videos.</p>

        <form id="loginForm">

            <label>Username</label>
            <input
                type="text"
                id="username"
                placeholder="Enter username"
                required
            >

            <label>Password</label>

            <div class="password-box">
                <input
                    type="password"
                    id="password"
                    placeholder="Enter password"
                    required
                >

                <button type="button" id="showPassword">
                    👁
                </button>
            </div>

            <p id="loginError" class="error"></p>

            <button class="login-btn" type="submit">
                Login
            </button>

        </form>

        <a href="index.html" class="back">
            ← Back to website
        </a>

    </div>

</div>


<div id="adminPage" class="admin-page">

    <header class="admin-navbar">

        <div class="logo">
            PR <span>CP</span>
        </div>

        <div class="admin-right">

            <span>
                👤 Admin
            </span>

            <button id="logoutBtn">
                Logout
            </button>

        </div>

    </header>


    <main class="dashboard">

        <div class="dashboard-header">

            <div>
                <p class="admin-label">CONTROL PANEL</p>
                <h1>Admin Dashboard</h1>
                <p>Manage your PR CP videos.</p>
            </div>

        </div>


        <div class="stats">

            <div class="stat-card">
                <span>Total Videos</span>
                <strong id="totalVideos">0</strong>
            </div>

            <div class="stat-card">
                <span>Class Videos</span>
                <strong id="classVideos">0</strong>
            </div>

            <div class="stat-card">
                <span>Tutorials</span>
                <strong id="tutorialVideos">0</strong>
            </div>

        </div>


        <section class="panel">

            <div class="panel-header">
                <h2>Add New Video</h2>
            </div>

            <form id="videoForm">

                <div class="form-grid">

                    <div>
                        <label>Video Title</label>

                        <input
                            type="text"
                            id="title"
                            placeholder="Example: Physics Chapter 1"
                            required
                        >
                    </div>


                    <div>
                        <label>Category</label>

                        <select id="category">

                            <option value="Class">
                                Class
                            </option>

                            <option value="Tutorial">
                                Tutorial
                            </option>

                            <option value="Other">
                                Other
                            </option>

                        </select>
                    </div>


                    <div class="full">

                        <label>Video URL</label>

                        <input
                            type="url"
                            id="videoUrl"
                            placeholder="https://youtube.com/watch?v=..."
                            required
                        >

                    </div>


                    <div class="full">

                        <label>Description</label>

                        <textarea
                            id="description"
                            placeholder="Video description..."
                        ></textarea>

                    </div>

                </div>


                <button class="add-btn" type="submit">
                    + Add Video
                </button>

            </form>

        </section>


        <section class="panel">

            <div class="panel-header">

                <h2>Video Management</h2>

                <input
                    type="text"
                    id="adminSearch"
                    placeholder="Search videos..."
                >

            </div>

            <div id="adminVideoList"></div>

        </section>

    </main>

</div>

<script src="admin.js"></script>

</body>
</html>
