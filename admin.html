<!DOCTYPE html>

<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>PR CP - Admin</title>

  <link rel="stylesheet" href="style.css">

  <script
    type="module"
    src="admin.js"
  ></script>

</head>


<body>


<header class="navbar">

  <div class="logo">
    PR <span>CP</span>
  </div>

  <nav>

    <a href="index.html">
      Home
    </a>

  </nav>

</header>



<main class="admin-container">


<h1>
  Photo Admin
</h1>

<p class="admin-subtitle">
  Upload and manage PR CP photos.
</p>



<!-- UPLOAD -->

<div class="admin-card">

  <h2>
    Upload Photo
  </h2>


  <form id="uploadForm">


    <label>
      Photo
    </label>

    <input
      type="file"
      id="photoFile"
      accept="image/*"
      required
    >


    <label>
      Title
    </label>

    <input
      type="text"
      id="photoTitle"
      placeholder="Photo title"
      required
    >


    <label>
      Description
    </label>

    <textarea
      id="photoDescription"
      placeholder="Photo description"
    ></textarea>


    <label>
      Category
    </label>

    <select id="photoCategory">

      <option value="class">
        Class
      </option>

      <option value="event">
        Event
      </option>

      <option value="other">
        Other
      </option>

    </select>


    <button
      type="submit"
      class="upload-btn"
      id="uploadBtn"
    >

      Upload Photo

    </button>


  </form>


  <div id="uploadStatus"></div>

</div>



<!-- MANAGE -->

<div class="admin-card">

  <h2>
    Uploaded Photos
  </h2>


  <div id="adminPhotoGrid">

    Loading...

  </div>

</div>


</main>



</body>

</html>
