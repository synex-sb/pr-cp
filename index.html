<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>PR CP - Video & Photo Platform</title>

  <link rel="stylesheet" href="style.css">

  <script type="module" src="app.js"></script>
</head>

<body>

<header class="navbar">

  <div class="logo">
    PR <span>CP</span>
  </div>

  <nav>
    <a href="#videos">Videos</a>
    <a href="#photos">Photos</a>
    <a href="admin.html">Admin</a>
  </nav>

</header>


<section class="hero">

  <div>
    <h1>PR CP</h1>

    <h2>VIDEO & PHOTO PLATFORM</h2>

    <p>
      Learn. Watch. Grow.
    </p>

    <a href="#photos" class="hero-btn">
      Explore Photos
    </a>
  </div>

</section>


<!-- VIDEOS -->

<section id="videos" class="section">

  <div class="section-head">

    <div>
      <h2>Video Library</h2>
      <p>Watch educational and useful videos.</p>
    </div>

  </div>


  <div class="search-box">

    <input
      type="text"
      id="videoSearch"
      placeholder="Search videos..."
    >

  </div>


  <div id="videoGrid" class="video-grid">

    <!-- Existing videos can be added here -->

  </div>

</section>



<!-- PHOTOS -->

<section id="photos" class="section">

  <div class="section-head">

    <div>
      <h2>Photo Gallery</h2>
      <p>Explore uploaded photos.</p>
    </div>

  </div>


  <div class="search-box">

    <input
      type="text"
      id="photoSearch"
      placeholder="Search photos..."
    >

  </div>


  <div class="categories">

    <button class="category active" data-category="all">
      All
    </button>

    <button class="category" data-category="class">
      Class
    </button>

    <button class="category" data-category="event">
      Event
    </button>

    <button class="category" data-category="other">
      Other
    </button>

  </div>


  <div id="photoGrid" class="photo-grid">

    <div class="loading">
      Loading photos...
    </div>

  </div>

</section>



<footer>

  <p>
    © 2026 PR CP. All Rights Reserved.
  </p>

</footer>


</body>
</html>
