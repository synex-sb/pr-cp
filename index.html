<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PR CP - Video Platform</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<header class="navbar">
    <div class="logo">
        <span>PR</span> CP
    </div>

    <nav>
        <a href="#home">Home</a>
        <a href="#videos">Videos</a>
        <a href="#add">Add Video</a>
    </nav>
</header>

<section class="hero" id="home">
    <div>
        <p class="tag">PR CP VIDEO PLATFORM</p>
        <h1>Learn. Watch.<br><span>Grow.</span></h1>
        <p class="hero-text">
            Share your educational videos and organize everything
            in one simple platform.
        </p>

        <a href="#videos" class="btn">Browse Videos</a>
    </div>
</section>

<section class="container" id="videos">

    <div class="section-header">
        <div>
            <p class="small-title">VIDEO LIBRARY</p>
            <h2>All Videos</h2>
        </div>

        <input
            type="text"
            id="searchInput"
            placeholder="Search videos..."
        >
    </div>

    <div class="categories">
        <button class="category active" data-category="All">All</button>
        <button class="category" data-category="Class">Class</button>
        <button class="category" data-category="Tutorial">Tutorial</button>
        <button class="category" data-category="Other">Other</button>
    </div>

    <div id="videoGrid" class="video-grid"></div>

</section>


<section class="add-section" id="add">

    <div class="container">

        <div class="section-header">
            <div>
                <p class="small-title">ADMIN</p>
                <h2>Add New Video</h2>
            </div>
        </div>

        <form id="videoForm">

            <div class="form-grid">

                <div class="form-group">
                    <label>Video Title</label>
                    <input
                        type="text"
                        id="title"
                        placeholder="Example: Physics Chapter 1"
                        required
                    >
                </div>

                <div class="form-group">
                    <label>Category</label>

                    <select id="category">
                        <option value="Class">Class</option>
                        <option value="Tutorial">Tutorial</option>
                        <option value="Other">Other</option>
                    </select>
                </div>

                <div class="form-group full">
                    <label>Video Link</label>

                    <input
                        type="url"
                        id="videoUrl"
                        placeholder="https://www.youtube.com/watch?v=..."
                        required
                    >
                </div>

                <div class="form-group full">
                    <label>Description</label>

                    <textarea
                        id="description"
                        placeholder="Write a short description..."
                    ></textarea>
                </div>

            </div>

            <button type="submit" class="btn">
                + Add Video
            </button>

        </form>

    </div>

</section>


<div id="videoModal" class="modal">

    <div class="modal-content">

        <button id="closeModal" class="close">&times;</button>

        <div id="player"></div>

        <div class="modal-info">
            <h2 id="modalTitle"></h2>
            <p id="modalDescription"></p>
        </div>

    </div>

</div>


<footer>
    <p>© 2026 PR CP. All Rights Reserved.</p>
</footer>

<script src="script.js"></script>

</body>
</html>
