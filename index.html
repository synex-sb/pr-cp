<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>PR CP - Video Platform</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<header class="navbar">

    <a href="index.html" class="logo">
        PR <span>CP</span>
    </a>

    <nav>
        <a href="#videos">Videos</a>
        <a href="admin.html">Admin</a>
    </nav>

</header>


<section class="hero">

    <div class="hero-content">

        <p class="eyebrow">
            PR CP VIDEO PLATFORM
        </p>

        <h1>
            Learn. Watch.
            <span>Grow.</span>
        </h1>

        <p class="hero-description">
            Watch videos and useful resources published by PR CP.
        </p>

        <a href="#videos" class="hero-button">
            Browse Videos
        </a>

    </div>

</section>


<section id="videos" class="videos-section">

    <div class="section-top">

        <div>
            <p class="eyebrow">
                VIDEO LIBRARY
            </p>

            <h2>
                Published Videos
            </h2>
        </div>

        <input
            type="search"
            id="searchInput"
            placeholder="Search videos..."
        >

    </div>


    <div class="category-bar">

        <button class="category active" data-category="All">
            All
        </button>

        <button class="category" data-category="Class">
            Class
        </button>

        <button class="category" data-category="Tutorial">
            Tutorial
        </button>

        <button class="category" data-category="Other">
            Other
        </button>

    </div>


    <div id="videoGrid" class="video-grid">

        <div class="loading">
            Loading videos...
        </div>

    </div>

</section>


<footer>

    <p>
        © 2026 PR CP. All Rights Reserved.
    </p>

</footer>


<script type="module" src="app.js"></script>

</body>
</html>
